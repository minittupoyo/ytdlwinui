name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test tool downloads and checksums
        run: dotnet test .\YtdlWinUI.Tests\YtdlWinUI.Tests.csproj --configuration Release
      - name: Build WinUI app
        run: dotnet build .\YtdlWinUI\YtdlWinUI.csproj --configuration Release -p:Platform=x64 -r win-x64
